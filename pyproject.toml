[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deye-modbus-toolkit"
version = "1.0.0"
description = "High-performance asynchronous Python engine & CLI for Deye, Sunsynk, and Sol-Ark hybrid inverters via native Modbus TCP/RTU."
readme = "README.md"
authors = [
    { name = "Abin Anil", email = "abinanil123@users.noreply.github.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Embedded Systems",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
cli = ["rich>=13.0.0"]
test = ["pytest>=7.0.0", "pytest-asyncio>=0.20.0"]

[project.scripts]
deye-cli = "deye_modbus.cli:main"

[project.urls]
Homepage = "https://github.com/abinanil123/deye-modbus-toolkit"
Repository = "https://github.com/abinanil123/deye-modbus-toolkit"
Issues = "https://github.com/abinanil123/deye-modbus-toolkit/issues"
